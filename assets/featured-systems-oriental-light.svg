      <text x="0" y="78" fill="#1B2128" font-size="25" font-weight="650">CrewBee</text>
      <text x="0" y="108" fill="#5D7B8A" font-size="11" font-weight="650" letter-spacing="1.5">MAINTAINABLE AGENT TEAMS</text>
      <text x="0" y="147" fill="#6F7A85" font-size="13">Prompts, roles, review, and completion criteria</text>
      <text x="0" y="169" fill="#6F7A85" font-size="13">shaped into reusable engineering assets.</text>
      <line x1="0" y1="199" x2="492" y2="199" stroke="#C9C4BA"/>
