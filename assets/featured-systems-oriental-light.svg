      <path d="M0 35.5H36M35.5 0V36" fill="none" stroke="#C9C4BA" stroke-opacity=".11" stroke-width=".6"/>
      <circle cx="6" cy="8" r=".65" fill="#6F7A85" fill-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#F6F4EF"/>
  <rect width="1200" height="330" rx="18" fill="url(#paper)"/>
  <rect x=".5" y=".5" width="1199" height="329" rx="17.5" fill="none" stroke="#C9C4BA"/>
  <text x="52" y="48" fill="#5D7B8A" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" letter-spacing="2.4">FEATURED SYSTEMS / 02</text>
