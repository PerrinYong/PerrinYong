      <text x="0" y="108" fill="#9C7C58" font-size="11" font-weight="650" letter-spacing="1.5">OBSERVABLE AGENT WORK</text>
      <text x="0" y="147" fill="#6F7A85" font-size="13">Projects, runs, events, audit trails, and costs</text>
      <text x="0" y="169" fill="#6F7A85" font-size="13">shaped into a lightweight operating layer.</text>
