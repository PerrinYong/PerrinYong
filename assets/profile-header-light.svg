      <stop offset="0" stop-color="#F6F8FA"/>
      <stop offset="1" stop-color="#EEF2F5"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F91A4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4F7183" stop-opacity="0.78"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8C2CC" stroke-width="1" stroke-opacity="0.32"/>
