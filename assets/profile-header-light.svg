<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Yong — Engineering across boundaries</title>
  <desc id="desc">A luminous, precise composition of layered system boundaries.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.58" stop-color="#EEF8FE"/>
      <stop offset="1" stop-color="#DDF2FC"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0369A1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="0.72" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#D39224"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7BB9D8" stroke-width="1" stroke-opacity="0.34"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="16" fill="url(#surface)" stroke="#9BCBE2" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="246" rx="15" fill="url(#grid)" opacity="0.62"/>
  <ellipse cx="965" cy="92" rx="320" ry="165" fill="url(#halo)"/>

  <g transform="translate(76 67)">
    <text x="0" y="36" fill="#0B2340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="7">YONG</text>
    <text x="2" y="74" fill="#0369A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" letter-spacing="2.4">ENGINEERING ACROSS BOUNDARIES</text>
    <line x1="2" y1="98" x2="376" y2="98" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="383" cy="98" r="5" fill="#D39224" filter="url(#glow)"/>
    <text x="2" y="124" fill="#407692" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.4">SYSTEMS · TOOLS · PRODUCTS · WORKFLOWS</text>
  </g>

  <g transform="translate(684 34)">
    <path d="M0 154L150 70L420 70L270 154Z" fill="#D7EDF7" stroke="#8CBED6" stroke-width="2"/>
    <path d="M42 129L170 56L448 56L320 129Z" fill="#E2F3FA" stroke="url(#edge)" stroke-width="2"/>
    <path d="M91 103L198 42L470 42L363 103Z" fill="#EAF7FC" stroke="#159ACF" stroke-width="2" stroke-opacity="0.82"/>
    <path d="M146 76L228 29L488 29L406 76Z" fill="#F7FCFF" stroke="#0369A1" stroke-width="2"/>
    <path d="M151 78L405 78" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="151" cy="78" r="5" fill="#D39224" filter="url(#glow)"/>
    <circle cx="405" cy="78" r="5" fill="#0EA5E9" filter="url(#glow)"/>
    <path d="M270 154V184M320 129V172M363 103V160M406 76V147" stroke="#1488B8" stroke-width="1.5" stroke-opacity="0.56"/>
    <path d="M270 184H494" stroke="#7DB6D1" stroke-width="2"/>
    <circle cx="494" cy="184" r="5" fill="#0EA5E9" filter="url(#glow)"/>
  </g>
</svg>
