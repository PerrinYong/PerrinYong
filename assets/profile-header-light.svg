  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="16" fill="url(#surface)" stroke="#D0D7DE" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="246" rx="15" fill="url(#grid)" opacity="0.62"/>

