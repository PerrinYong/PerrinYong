  <g transform="translate(500 147)" filter="url(#shadow)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect width="200" height="88" rx="44" fill="url(#core)"/>
    <text x="100" y="39" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="750" letter-spacing="1.5">RELIABLE SOFTWARE</text>
    <text x="100" y="62" text-anchor="middle" fill="#d9f4f7" font-family="Consolas, monospace" font-size="10">UNDERSTAND · TEST · REVIEW</text>
  </g>

  <text x="600" y="356" text-anchor="middle" fill="#718697" font-family="Consolas, monospace" font-size="11" letter-spacing="1">BOUNDARIES BECOME EXPLICIT INTERFACES</text>
  <rect x=".5" y=".5" width="1199" height="379" rx="19.5" fill="none" stroke="#d2dde5"/>
