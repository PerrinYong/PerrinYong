  <text x="600" y="356" text-anchor="middle" fill="#70889a" font-family="Consolas, monospace" font-size="11" letter-spacing="1">BOUNDARIES BECOME EXPLICIT INTERFACES</text>
  <rect x=".5" y=".5" width="1199" height="379" rx="19.5" fill="none" stroke="#20384c"/>
