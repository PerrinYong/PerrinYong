<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Yong's capability map</title>
  <desc id="desc">Five engineering capability groups connect to a central reliable software outcome.</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1494aa"/>
      <stop offset="1" stop-color="#6c5ed1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7890a5" fill-opacity=".13"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#37c0d6" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="20" fill="#07111f"/>
  <rect width="1200" height="380" rx="20" fill="url(#dots)"/>

  <g fill="none" stroke="#355067" stroke-width="1.4">
    <path d="M314 104C422 104 440 170 515 177"/>
    <path d="M314 278C424 278 439 216 515 204"/>
    <path d="M886 104C777 104 760 169 685 177"/>
    <path d="M886 278C776 278 759 217 685 204"/>
    <path d="M600 92V147" stroke="#695335"/>
  </g>
  <g fill="#07111f" stroke-width="2">
    <circle cx="515" cy="177" r="5" stroke="#41c6dc"/>
    <circle cx="515" cy="204" r="5" stroke="#41c6dc"/>
    <circle cx="685" cy="177" r="5" stroke="#9b8cff"/>
    <circle cx="685" cy="204" r="5" stroke="#9b8cff"/>
    <circle cx="600" cy="147" r="5" stroke="#efb45e"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(48 57)">
      <rect width="266" height="94" rx="14" fill="#0b1827" stroke="#29475a"/>
      <rect width="5" height="94" rx="2.5" fill="#41c6dc"/>
      <text x="24" y="31" fill="#e2edf3" font-size="13" font-weight="700" letter-spacing="1.4">CROSS-LANGUAGE</text>
      <text x="24" y="58" fill="#a4b7c6" font-size="13">C# · C++ · Java · Python</text>
      <text x="24" y="78" fill="#71899d" font-size="11">Native bridges · SDK contracts</text>
    </g>
    <g transform="translate(48 231)">
      <rect width="266" height="94" rx="14" fill="#0b1827" stroke="#29475a"/>
      <rect width="5" height="94" rx="2.5" fill="#41c6dc"/>
      <text x="24" y="31" fill="#e2edf3" font-size="13" font-weight="700" letter-spacing="1.4">CROSS-PLATFORM</text>
      <text x="24" y="58" fill="#a4b7c6" font-size="13">Windows · Android · iOS · WebGL</text>
      <text x="24" y="78" fill="#71899d" font-size="11">Compatibility · Delivery constraints</text>
    </g>
    <g transform="translate(886 57)">
      <rect width="266" height="94" rx="14" fill="#0b1827" stroke="#4b4274"/>
      <rect x="261" width="5" height="94" rx="2.5" fill="#9b8cff"/>
      <text x="24" y="31" fill="#e2edf3" font-size="13" font-weight="700" letter-spacing="1.4">DELIVERY SYSTEMS</text>
      <text x="24" y="58" fill="#a4b7c6" font-size="13">CI/CD · Testing · Diagnostics</text>
      <text x="24" y="78" fill="#71899d" font-size="11">Observability · Verifiable completion</text>
    </g>
    <g transform="translate(886 231)">
      <rect width="266" height="94" rx="14" fill="#0b1827" stroke="#4b4274"/>
      <rect x="261" width="5" height="94" rx="2.5" fill="#9b8cff"/>
      <text x="24" y="31" fill="#e2edf3" font-size="13" font-weight="700" letter-spacing="1.4">AGENT WORKFLOWS</text>
      <text x="24" y="58" fill="#a4b7c6" font-size="13">Responsibilities · Tools · Review</text>
      <text x="24" y="78" fill="#71899d" font-size="11">Governance · Durable context</text>
    </g>
    <g transform="translate(467 20)">
      <rect width="266" height="72" rx="14" fill="#121a24" stroke="#695335"/>
      <rect y="67" width="266" height="5" rx="2.5" fill="#efb45e"/>
