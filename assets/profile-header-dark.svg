      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F91A4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8DA9B8" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27313B" stroke-width="1" stroke-opacity="0.28"/>
