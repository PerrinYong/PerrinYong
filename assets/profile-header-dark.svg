<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Yong — Engineering across boundaries</title>
  <desc id="desc">A quiet, precise composition of layered system boundaries.</desc>
  <defs>
